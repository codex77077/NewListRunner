name: tmp-query-asc-groups

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  query:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      A0: ${{ secrets.A0 }}
      A1: ${{ secrets.A1 }}
      A2: ${{ secrets.A2 }}
      A5: ${{ secrets.A5 }}
      A7: ${{ secrets.A7 }}
      P1: ${{ secrets.P1 }}
      P2: ${{ secrets.P2 }}
      P3: ${{ secrets.P3 }}
    steps:
      - name: prepare
        run: |
          set -euo pipefail
          install -m 700 -d "$RUNNER_TEMP/k"
          printf '%s\n' "$P2" > "$RUNNER_TEMP/k/id"
          chmod 600 "$RUNNER_TEMP/k/id"
          ssh-keyscan github.com > "$RUNNER_TEMP/k/known_hosts" 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/k/id -o IdentitiesOnly=yes -o UserKnownHostsFile=$RUNNER_TEMP/k/known_hosts"
          git clone --quiet "$P1" "$RUNNER_TEMP/p"
          git -C "$RUNNER_TEMP/p" checkout --quiet --detach "$P3"
          printf '%s' "$A2" > "$RUNNER_TEMP/k/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/k/AuthKey.p8"
          find "$RUNNER_TEMP/k" -type f ! -name AuthKey.p8 -delete
      - name: query groups
        run: |
          set -euo pipefail
          export ASC_ISSUER_ID="$A0"
          export ASC_KEY_ID="$A1"
          export ASC_PRIVATE_KEY_PATH="$RUNNER_TEMP/k/AuthKey.p8"
          ruby -I"$RUNNER_TEMP/p/tools" -rasc -rjson - <<'RUBY'
          client = AscClient.new
          targets = %w[macos openlist@beta]
          app_ids = [ENV.fetch("A5"), ENV.fetch("A7")].uniq
          matches = []
          app_ids.each do |app_id|
            path = client.query("/v1/betaGroups", { "filter[app]" => app_id, "limit" => "200" })
            client.list(path).each do |group|
              name = group.dig("attributes", "name").to_s
              next unless targets.include?(name.downcase)

              matches << {
                "name" => name,
                "app_id" => app_id,
                "group_id" => group.fetch("id"),
                "is_internal_group" => group.dig("attributes", "isInternalGroup")
              }
            end
          end
          abort "no matching groups found" if matches.empty?

          puts JSON.pretty_generate(matches)
          RUBY
      - name: cleanup
        if: always()
        run: |
          find "$RUNNER_TEMP/k" "$RUNNER_TEMP/p" -depth -delete 2>/dev/null || true
