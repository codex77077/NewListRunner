name: temporary-delete-unused-macos-profile

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  delete:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ASC_ISSUER_ID: ${{ secrets.A0 }}
      ASC_KEY_ID: ${{ secrets.A1 }}
      ASC_PRIVATE_KEY: ${{ secrets.A2 }}
      PROFILE_NAME: NewList macOS CI Manual 20260814015617
      PROFILE_UUID: 4b072c4c-43b0-4ae4-b778-1ab82b30a3c4
    steps:
      - uses: actions/checkout@v6
      - name: 删除未使用的临时 profile
        run: ruby .github/scripts/temporary-delete-unused-macos-profile.rb
