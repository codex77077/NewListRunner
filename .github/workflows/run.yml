name: run

on:
  workflow_dispatch:
    inputs:
      p0:
        type: choice
        options:
          - release
          - main
        default: release

permissions:
  contents: read

concurrency:
  group: run
  cancel-in-progress: false

jobs:
  a:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      B3: ${{ secrets.B3 }}
      K0: ${{ secrets.K0 }}
      K1: ${{ secrets.K1 }}
      K2: ${{ secrets.K2 }}
      K3: ${{ secrets.K3 }}
      K4: ${{ secrets.K4 }}
      K5: ${{ secrets.K5 }}
      K6: ${{ secrets.K6 }}
      K7: ${{ secrets.K7 }}
      K8: ${{ secrets.K8 }}
      K9: ${{ secrets.K9 }}
      K10: ${{ secrets.K10 }}
      K11: ${{ secrets.K11 }}
      P0: ${{ inputs.p0 }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: prepare
        env:
          P1: ${{ secrets.P1 }}
          P2: ${{ secrets.P2 }}
          P3: ${{ secrets.P3 }}
        run: |
          install -m 700 -d "$RUNNER_TEMP/k"
          printf '%s\n' "$P2" > "$RUNNER_TEMP/k/i"
          chmod 600 "$RUNNER_TEMP/k/i"
          ssh-keyscan github.com > "$RUNNER_TEMP/k/h" 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/k/i -o IdentitiesOnly=yes -o UserKnownHostsFile=$RUNNER_TEMP/k/h"
          git clone --quiet "$P1" "$RUNNER_TEMP/p"
          git -C "$RUNNER_TEMP/p" checkout --quiet --detach "$P3"
          rm -rf "$RUNNER_TEMP/k"
      - name: execute
        run: cd "$RUNNER_TEMP/p" && ./run-a.sh
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: x
          path: ${{ runner.temp }}/o/x.bin
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e-a
          path: ${{ runner.temp }}/o/e.bin
          retention-days: 1
          if-no-files-found: ignore

  b:
    needs: a
    runs-on: macos-15
    timeout-minutes: 90
    env:
      B3: ${{ secrets.B3 }}
      P0: ${{ inputs.p0 }}
    steps:
      - name: prepare
        env:
          P1: ${{ secrets.P1 }}
          P2: ${{ secrets.P2 }}
          P3: ${{ secrets.P3 }}
        run: |
          install -m 700 -d "$RUNNER_TEMP/k"
          printf '%s\n' "$P2" > "$RUNNER_TEMP/k/i"
          chmod 600 "$RUNNER_TEMP/k/i"
          ssh-keyscan github.com > "$RUNNER_TEMP/k/h" 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/k/i -o IdentitiesOnly=yes -o UserKnownHostsFile=$RUNNER_TEMP/k/h"
          git clone --quiet "$P1" "$RUNNER_TEMP/p"
          git -C "$RUNNER_TEMP/p" checkout --quiet --detach "$P3"
          rm -rf "$RUNNER_TEMP/k"
      - uses: actions/download-artifact@v8
        with:
          name: x
          path: ${{ runner.temp }}/i
      - name: execute
        run: cd "$RUNNER_TEMP/p" && ./run-b.sh
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: y
          path: ${{ runner.temp }}/o/y.bin
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e-b
          path: ${{ runner.temp }}/o/e.bin
          retention-days: 1
          if-no-files-found: ignore

  c:
    needs: b
    runs-on: macos-26
    timeout-minutes: 120
    env:
      B3: ${{ secrets.B3 }}
      P0: ${{ inputs.p0 }}
      Q0: ${{ secrets.Q0 }}
      Q1: ${{ secrets.Q1 }}
      A0: ${{ secrets.A0 }}
      A1: ${{ secrets.A1 }}
      A2: ${{ secrets.A2 }}
      A3: ${{ secrets.A3 }}
      A4: ${{ secrets.A4 }}
      A9: ${{ secrets.A9 }}
      A10: ${{ secrets.A10 }}
      A5: ${{ secrets.A5 }}
      A6: ${{ secrets.A6 }}
    steps:
      - uses: actions/setup-go@v6
        with:
          go-version: 1.24.13
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: prepare
        env:
          P1: ${{ secrets.P1 }}
          P2: ${{ secrets.P2 }}
          P3: ${{ secrets.P3 }}
        run: |
          install -m 700 -d "$RUNNER_TEMP/k"
          printf '%s\n' "$P2" > "$RUNNER_TEMP/k/i"
          chmod 600 "$RUNNER_TEMP/k/i"
          ssh-keyscan github.com > "$RUNNER_TEMP/k/h" 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/k/i -o IdentitiesOnly=yes -o UserKnownHostsFile=$RUNNER_TEMP/k/h"
          git clone --quiet "$P1" "$RUNNER_TEMP/p"
          git -C "$RUNNER_TEMP/p" checkout --quiet --detach "$P3"
          rm -rf "$RUNNER_TEMP/k"
      - uses: actions/download-artifact@v8
        with:
          name: y
          path: ${{ runner.temp }}/i
      - name: execute
        run: cd "$RUNNER_TEMP/p" && ./run-c.sh
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: c
          path: ${{ runner.temp }}/o/c.bin
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e-c
          path: ${{ runner.temp }}/o/e.bin
          retention-days: 1
          if-no-files-found: ignore

  d:
    needs: b
    runs-on: macos-26
    timeout-minutes: 120
    env:
      B3: ${{ secrets.B3 }}
      P0: ${{ inputs.p0 }}
      Q2: ${{ secrets.Q2 }}
      Q3: ${{ secrets.Q3 }}
      A0: ${{ secrets.A0 }}
      A1: ${{ secrets.A1 }}
      A2: ${{ secrets.A2 }}
      A3: ${{ secrets.A3 }}
      A4: ${{ secrets.A4 }}
      A9: ${{ secrets.A9 }}
      A10: ${{ secrets.A10 }}
      A7: ${{ secrets.A7 }}
      A8: ${{ secrets.A8 }}
    steps:
      - uses: actions/setup-go@v6
        with:
          go-version: 1.24.13
      - name: prepare
        env:
          P1: ${{ secrets.P1 }}
          P2: ${{ secrets.P2 }}
          P3: ${{ secrets.P3 }}
        run: |
          install -m 700 -d "$RUNNER_TEMP/k"
          printf '%s\n' "$P2" > "$RUNNER_TEMP/k/i"
          chmod 600 "$RUNNER_TEMP/k/i"
          ssh-keyscan github.com > "$RUNNER_TEMP/k/h" 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/k/i -o IdentitiesOnly=yes -o UserKnownHostsFile=$RUNNER_TEMP/k/h"
          git clone --quiet "$P1" "$RUNNER_TEMP/p"
          git -C "$RUNNER_TEMP/p" checkout --quiet --detach "$P3"
          rm -rf "$RUNNER_TEMP/k"
      - uses: actions/download-artifact@v8
        with:
          name: y
          path: ${{ runner.temp }}/i
      - name: execute
        run: cd "$RUNNER_TEMP/p" && ./run-d.sh
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: d
          path: ${{ runner.temp }}/o/d.bin
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e-d
          path: ${{ runner.temp }}/o/e.bin
          retention-days: 1
          if-no-files-found: ignore
