name: run

on:
  workflow_dispatch:
    inputs:
      p0:
        type: choice
        options:
          - release
          - main
        default: release
      p1:
        type: string
        required: false
        default: ""
      assign_testflight_groups:
        description: 将 main 构建加入已配置的 TestFlight 分组
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: run-${{ inputs.p0 }}
  cancel-in-progress: false

jobs:
  a:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      B3: ${{ secrets.B3 }}
      K0: ${{ secrets.K0 }}
      K1: ${{ secrets.K1 }}
      K2: ${{ secrets.K2 }}
      K3: ${{ secrets.K3 }}
      K4: ${{ secrets.K4 }}
      K5: ${{ secrets.K5 }}
      K6: ${{ secrets.K6 }}
      K7: ${{ secrets.K7 }}
      K8: ${{ secrets.K8 }}
      K9: ${{ secrets.K9 }}
      K10: ${{ secrets.K10 }}
      K11: ${{ secrets.K11 }}
      P0: ${{ inputs.p0 }}
      R0: ${{ inputs.p1 }}
      W0: ${{ secrets.W0 }}
      W1: ${{ secrets.W1 }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: prepare
        env:
          P1: ${{ secrets.P1 }}
          P2: ${{ secrets.P2 }}
          P3: ${{ secrets.P3 }}
        run: |
          install -m 700 -d "$RUNNER_TEMP/k"
          printf '%s\n' "$P2" > "$RUNNER_TEMP/k/i"
          chmod 600 "$RUNNER_TEMP/k/i"
          ssh-keyscan github.com > "$RUNNER_TEMP/k/h" 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/k/i -o IdentitiesOnly=yes -o UserKnownHostsFile=$RUNNER_TEMP/k/h"
          git clone --quiet "$P1" "$RUNNER_TEMP/p"
          git -C "$RUNNER_TEMP/p" checkout --quiet --detach "$P3"
          rm -rf "$RUNNER_TEMP/k"
      - name: execute
        run: cd "$RUNNER_TEMP/p" && ./run-a.sh
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: x
          path: ${{ runner.temp }}/o/x.bin
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e-a
          path: ${{ runner.temp }}/o/e.bin
          retention-days: 1
          if-no-files-found: ignore

  b:
    needs: a
    runs-on: macos-15
    timeout-minutes: 90
    env:
      B3: ${{ secrets.B3 }}
      P0: ${{ inputs.p0 }}
    steps:
      - name: prepare
        env:
          P1: ${{ secrets.P1 }}
          P2: ${{ secrets.P2 }}
          P3: ${{ secrets.P3 }}
        run: |
          install -m 700 -d "$RUNNER_TEMP/k"
          printf '%s\n' "$P2" > "$RUNNER_TEMP/k/i"
          chmod 600 "$RUNNER_TEMP/k/i"
          ssh-keyscan github.com > "$RUNNER_TEMP/k/h" 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/k/i -o IdentitiesOnly=yes -o UserKnownHostsFile=$RUNNER_TEMP/k/h"
          git clone --quiet "$P1" "$RUNNER_TEMP/p"
          git -C "$RUNNER_TEMP/p" checkout --quiet --detach "$P3"
          rm -rf "$RUNNER_TEMP/k"
      - uses: actions/download-artifact@v8
        with:
          name: x
          path: ${{ runner.temp }}/i
      - name: execute
        run: cd "$RUNNER_TEMP/p" && ./run-b.sh
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: y
          path: ${{ runner.temp }}/o/y.bin
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e-b
          path: ${{ runner.temp }}/o/e.bin
          retention-days: 1
          if-no-files-found: ignore

  c:
    needs: b
    runs-on: macos-26
    timeout-minutes: 120
    env:
      B3: ${{ secrets.B3 }}
      P0: ${{ inputs.p0 }}
      Q0: ${{ secrets.Q0 }}
      Q1: ${{ secrets.Q1 }}
      A0: ${{ secrets.A0 }}
      A1: ${{ secrets.A1 }}
      A2: ${{ secrets.A2 }}
      A3: ${{ secrets.A3 }}
      A4: ${{ secrets.A4 }}
      A9: ${{ secrets.A9 }}
      A10: ${{ secrets.A10 }}
      A5: ${{ secrets.A5 }}
      A6: ${{ secrets.A6 }}
      W0: ${{ secrets.W0 }}
      W1: ${{ secrets.W1 }}
      T1: ${{ inputs.assign_testflight_groups }}
    steps:
      - uses: actions/setup-go@v6
        with:
          go-version: 1.24.13
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: prepare
        env:
          P1: ${{ secrets.P1 }}
          P2: ${{ secrets.P2 }}
          P3: ${{ secrets.P3 }}
        run: |
          install -m 700 -d "$RUNNER_TEMP/k"
          printf '%s\n' "$P2" > "$RUNNER_TEMP/k/i"
          chmod 600 "$RUNNER_TEMP/k/i"
          ssh-keyscan github.com > "$RUNNER_TEMP/k/h" 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/k/i -o IdentitiesOnly=yes -o UserKnownHostsFile=$RUNNER_TEMP/k/h"
          git clone --quiet "$P1" "$RUNNER_TEMP/p"
          git -C "$RUNNER_TEMP/p" checkout --quiet --detach "$P3"
          rm -rf "$RUNNER_TEMP/k"
      - name: prepare iOS app
        id: ios-deps
        env:
          APP_REPO_URL: ${{ secrets.Q0 }}
          APP_REPO_KEY: ${{ secrets.Q1 }}
        run: cd "$RUNNER_TEMP/p" && ./scripts/prepare-ios-app.sh
      - name: restore Yarn cache
        id: yarn-cache
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/Yarn
          key: ios-yarn-v1-${{ runner.os }}-${{ runner.arch }}-node20-yarn1.22.22-${{ steps.ios-deps.outputs.yarn_lock }}
      - name: restore CocoaPods cache
        id: pods-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ${{ runner.temp }}/app-ios/ios/Pods
          key: ios-pods-v1-${{ runner.os }}-${{ runner.arch }}-cocoapods1.16.2-${{ steps.ios-deps.outputs.xcode }}-${{ steps.ios-deps.outputs.pod_lock }}
      - name: report dependency caches
        run: |
          printf 'dependency cache hits: yarn=%s pods=%s\n' '${{ steps.yarn-cache.outputs.cache-hit }}' '${{ steps.pods-cache.outputs.cache-hit }}'
      - uses: actions/download-artifact@v8
        with:
          name: y
          path: ${{ runner.temp }}/i
      - name: execute
        run: cd "$RUNNER_TEMP/p" && ./run-c.sh
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e-c
          path: ${{ runner.temp }}/o/e.bin
          retention-days: 1
          if-no-files-found: ignore

  d:
    needs: b
    runs-on: macos-26
    timeout-minutes: 120
    env:
      B3: ${{ secrets.B3 }}
      P0: ${{ inputs.p0 }}
      Q2: ${{ secrets.Q2 }}
      Q3: ${{ secrets.Q3 }}
      A0: ${{ secrets.A0 }}
      A1: ${{ secrets.A1 }}
      A2: ${{ secrets.A2 }}
      A3: ${{ secrets.A3 }}
      A4: ${{ secrets.A4 }}
      A9: ${{ secrets.A9 }}
      A10: ${{ secrets.A10 }}
      A7: ${{ secrets.A7 }}
      A8: ${{ secrets.A8 }}
      W0: ${{ secrets.W0 }}
      W1: ${{ secrets.W1 }}
      T1: ${{ inputs.assign_testflight_groups }}
    steps:
      - uses: actions/setup-go@v6
        with:
          go-version: 1.24.13
          cache: false
      - name: prepare
        env:
          P1: ${{ secrets.P1 }}
          P2: ${{ secrets.P2 }}
          P3: ${{ secrets.P3 }}
        run: |
          install -m 700 -d "$RUNNER_TEMP/k"
          printf '%s\n' "$P2" > "$RUNNER_TEMP/k/i"
          chmod 600 "$RUNNER_TEMP/k/i"
          ssh-keyscan github.com > "$RUNNER_TEMP/k/h" 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/k/i -o IdentitiesOnly=yes -o UserKnownHostsFile=$RUNNER_TEMP/k/h"
          git clone --quiet "$P1" "$RUNNER_TEMP/p"
          git -C "$RUNNER_TEMP/p" checkout --quiet --detach "$P3"
          rm -rf "$RUNNER_TEMP/k"
      - uses: actions/download-artifact@v8
        with:
          name: y
          path: ${{ runner.temp }}/i
      - name: execute
        run: cd "$RUNNER_TEMP/p" && ./run-d.sh
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e-d
          path: ${{ runner.temp }}/o/e.bin
          retention-days: 1
          if-no-files-found: ignore

  m:
    needs: b
    runs-on: macos-26
    timeout-minutes: 120
    env:
      B3: ${{ secrets.B3 }}
      P0: ${{ inputs.p0 }}
      Q2: ${{ secrets.Q2 }}
      Q3: ${{ secrets.Q3 }}
      A0: ${{ secrets.A0 }}
      A1: ${{ secrets.A1 }}
      A2: ${{ secrets.A2 }}
      A3: ${{ secrets.A3 }}
      A4: ${{ secrets.A4 }}
      A5: ${{ secrets.A5 }}
      A6: ${{ secrets.A6 }}
      A7: ${{ secrets.A7 }}
      A8: ${{ secrets.A8 }}
      A11: ${{ secrets.A11 }}
      A14: ${{ secrets.A14 }}
      A15: ${{ secrets.A15 }}
      W0: ${{ secrets.W0 }}
      W1: ${{ secrets.W1 }}
      T1: ${{ inputs.assign_testflight_groups }}
    steps:
      - uses: actions/setup-go@v6
        with:
          go-version: 1.24.13
          cache: false
      - name: prepare
        env:
          P1: ${{ secrets.P1 }}
          P2: ${{ secrets.P2 }}
          P3: ${{ secrets.P3 }}
        run: |
          install -m 700 -d "$RUNNER_TEMP/k"
          printf '%s\n' "$P2" > "$RUNNER_TEMP/k/i"
          chmod 600 "$RUNNER_TEMP/k/i"
          ssh-keyscan github.com > "$RUNNER_TEMP/k/h" 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/k/i -o IdentitiesOnly=yes -o UserKnownHostsFile=$RUNNER_TEMP/k/h"
          git clone --quiet "$P1" "$RUNNER_TEMP/p"
          git -C "$RUNNER_TEMP/p" checkout --quiet --detach "$P3"
          rm -rf "$RUNNER_TEMP/k"
      - uses: actions/download-artifact@v8
        with:
          name: y
          path: ${{ runner.temp }}/i
      - name: execute
        run: cd "$RUNNER_TEMP/p" && ./run-m.sh
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e-m
          path: ${{ runner.temp }}/o/e.bin
          retention-days: 1
          if-no-files-found: ignore

  e:
    needs:
      - a
      - b
      - c
      - d
      - m
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      B3: ${{ secrets.B3 }}
      P0: ${{ inputs.p0 }}
      R0: ${{ inputs.p1 }}
      R1: ${{ needs.a.result == 'success' && needs.b.result == 'success' && needs.c.result == 'success' && needs.d.result == 'success' && needs.m.result == 'success' && 'success' || 'failure' }}
      W0: ${{ secrets.W0 }}
      W1: ${{ secrets.W1 }}
    steps:
      - uses: actions/setup-go@v6
        with:
          go-version: 1.24.13
          cache: false
      - name: prepare
        env:
          P1: ${{ secrets.P1 }}
          P2: ${{ secrets.P2 }}
          P3: ${{ secrets.P3 }}
        run: |
          install -m 700 -d "$RUNNER_TEMP/k"
          printf '%s\n' "$P2" > "$RUNNER_TEMP/k/i"
          chmod 600 "$RUNNER_TEMP/k/i"
          ssh-keyscan github.com > "$RUNNER_TEMP/k/h" 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/k/i -o IdentitiesOnly=yes -o UserKnownHostsFile=$RUNNER_TEMP/k/h"
          git clone --quiet "$P1" "$RUNNER_TEMP/p"
          git -C "$RUNNER_TEMP/p" checkout --quiet --detach "$P3"
          find "$RUNNER_TEMP/k" -depth -delete
      - uses: actions/download-artifact@v8
        if: env.R1 == 'success'
        with:
          name: y
          path: ${{ runner.temp }}/i
      - name: execute
        run: cd "$RUNNER_TEMP/p" && ./run-e.sh
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e-e
          path: ${{ runner.temp }}/o/e.bin
          retention-days: 1
          if-no-files-found: ignore

  g:
    needs:
      - b
      - e
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    env:
      B3: ${{ secrets.B3 }}
    steps:
      - uses: actions/setup-go@v6
        with:
          go-version: 1.24.13
          cache: false
      - name: prepare
        env:
          P1: ${{ secrets.P1 }}
          P2: ${{ secrets.P2 }}
          P3: ${{ secrets.P3 }}
        run: |
          install -m 700 -d "$RUNNER_TEMP/k"
          printf '%s\n' "$P2" > "$RUNNER_TEMP/k/i"
          chmod 600 "$RUNNER_TEMP/k/i"
          ssh-keyscan github.com > "$RUNNER_TEMP/k/h" 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/k/i -o IdentitiesOnly=yes -o UserKnownHostsFile=$RUNNER_TEMP/k/h"
          git clone --quiet "$P1" "$RUNNER_TEMP/p"
          git -C "$RUNNER_TEMP/p" checkout --quiet --detach "$P3"
          find "$RUNNER_TEMP/k" -depth -delete
      - name: execute
        env:
          GH_TOKEN: ${{ github.token }}
        run: cd "$RUNNER_TEMP/p" && ./run-g.sh
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e-g
          path: ${{ runner.temp }}/o/e.bin
          retention-days: 1
          if-no-files-found: ignore
