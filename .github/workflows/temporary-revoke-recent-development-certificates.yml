name: temporary-revoke-recent-development-certificates

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporary-revoke-recent-development-certificates
  cancel-in-progress: false

jobs:
  revoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ASC_ISSUER_ID: ${{ secrets.A0 }}
      ASC_KEY_ID: ${{ secrets.A1 }}
      ASC_PRIVATE_KEY: ${{ secrets.A2 }}
      APPLE_DISTRIBUTION_P12_BASE64: ${{ secrets.A3 }}
      APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.A4 }}
      CERTIFICATE_CUTOFF: '2026-08-08T07:40:00Z'
    steps:
      - uses: actions/checkout@v6
      - name: 撤销近期自动生成的开发证书
        run: ruby .github/scripts/temporary-revoke-recent-development-certificates.rb
