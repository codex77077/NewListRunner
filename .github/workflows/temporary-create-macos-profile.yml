name: temporary-create-macos-profile

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporary-create-macos-profile
  cancel-in-progress: false

jobs:
  create:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ASC_ISSUER_ID: ${{ secrets.A0 }}
      ASC_KEY_ID: ${{ secrets.A1 }}
      ASC_PRIVATE_KEY: ${{ secrets.A2 }}
      APPLE_DISTRIBUTION_P12_BASE64: ${{ secrets.A3 }}
      APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.A4 }}
      B3: ${{ secrets.B3 }}
    steps:
      - uses: actions/checkout@v6
      - name: 基于预置证书创建 macOS App Store profile
        run: ruby .github/scripts/temporary-create-macos-profile.rb "$RUNNER_TEMP/a11.bin"
      - uses: actions/upload-artifact@v7
        with:
          name: temporary-a11-profile
          path: ${{ runner.temp }}/a11.bin
          retention-days: 1
          if-no-files-found: error
