name: temporary-ios-cache

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 保留了 x 源码快照的 main run ID
        type: string
        required: true
        default: '32286523689'

permissions:
  actions: read
  contents: read

concurrency:
  group: temporary-ios-cache
  cancel-in-progress: false

jobs:
  framework:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      B3: ${{ secrets.B3 }}
      P0: main
    steps:
      - name: prepare
        env:
          P1: ${{ secrets.P1 }}
          P2: ${{ secrets.P2 }}
          P3: ${{ secrets.P3 }}
        run: |
          install -m 700 -d "$RUNNER_TEMP/k"
          printf '%s\n' "$P2" > "$RUNNER_TEMP/k/i"
          chmod 600 "$RUNNER_TEMP/k/i"
          ssh-keyscan github.com > "$RUNNER_TEMP/k/h" 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/k/i -o IdentitiesOnly=yes -o UserKnownHostsFile=$RUNNER_TEMP/k/h"
          git clone --quiet "$P1" "$RUNNER_TEMP/p"
          git -C "$RUNNER_TEMP/p" checkout --quiet --detach "$P3"
          find "$RUNNER_TEMP/k" -depth -delete
      - uses: actions/download-artifact@v8
        with:
          name: x
          path: ${{ runner.temp }}/i
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
      - name: build framework
        run: cd "$RUNNER_TEMP/p" && ./run-b.sh
      - uses: actions/upload-artifact@v7
        with:
          name: temporary-y
          path: ${{ runner.temp }}/o/y.bin
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: temporary-e-b
          path: ${{ runner.temp }}/o/e.bin
          retention-days: 1
          if-no-files-found: ignore

  cold:
    needs: framework
    runs-on: macos-26
    timeout-minutes: 120
    env: &ios_env
      B3: ${{ secrets.B3 }}
      P0: main
      Q0: ${{ secrets.Q0 }}
      Q1: ${{ secrets.Q1 }}
      A0: ${{ secrets.A0 }}
      A1: ${{ secrets.A1 }}
      A2: ${{ secrets.A2 }}
      A3: ${{ secrets.A3 }}
      A4: ${{ secrets.A4 }}
      A9: ${{ secrets.A9 }}
      A10: ${{ secrets.A10 }}
      A5: ${{ secrets.A5 }}
      A6: ${{ secrets.A6 }}
      W0: ${{ secrets.W0 }}
      W1: ${{ secrets.W1 }}
      T1: 'false'
      T2: 'true'
    steps: &ios_steps
      - uses: actions/setup-go@v6
        with:
          go-version: 1.24.13
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: prepare payload
        env:
          P1: ${{ secrets.P1 }}
          P2: ${{ secrets.P2 }}
          P3: ${{ secrets.P3 }}
        run: |
          install -m 700 -d "$RUNNER_TEMP/k"
          printf '%s\n' "$P2" > "$RUNNER_TEMP/k/i"
          chmod 600 "$RUNNER_TEMP/k/i"
          ssh-keyscan github.com > "$RUNNER_TEMP/k/h" 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/k/i -o IdentitiesOnly=yes -o UserKnownHostsFile=$RUNNER_TEMP/k/h"
          git clone --quiet "$P1" "$RUNNER_TEMP/p"
          git -C "$RUNNER_TEMP/p" checkout --quiet --detach "$P3"
          find "$RUNNER_TEMP/k" -depth -delete
      - name: prepare iOS app
        id: ios-deps
        env:
          APP_REPO_URL: ${{ secrets.Q0 }}
          APP_REPO_KEY: ${{ secrets.Q1 }}
        run: cd "$RUNNER_TEMP/p" && ./scripts/prepare-ios-app.sh
      - name: restore Yarn cache
        id: yarn-cache
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/Yarn
          key: ios-yarn-v1-${{ runner.os }}-${{ runner.arch }}-node20-yarn1.22.22-${{ steps.ios-deps.outputs.yarn_lock }}
      - name: restore CocoaPods cache
        id: pods-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ${{ runner.temp }}/app-ios/ios/Pods
          key: ios-pods-v1-${{ runner.os }}-${{ runner.arch }}-cocoapods1.16.2-${{ steps.ios-deps.outputs.xcode }}-${{ steps.ios-deps.outputs.pod_lock }}
      - name: report dependency caches
        run: |
          printf 'dependency cache hits: yarn=%s pods=%s\n' '${{ steps.yarn-cache.outputs.cache-hit }}' '${{ steps.pods-cache.outputs.cache-hit }}'
      - uses: actions/download-artifact@v8
        with:
          name: temporary-y
          path: ${{ runner.temp }}/i
      - name: build and validate iOS app without upload
        run: cd "$RUNNER_TEMP/p" && ./run-c.sh
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: temporary-e-ios-${{ github.job }}
          path: ${{ runner.temp }}/o/e.bin
          retention-days: 1
          if-no-files-found: ignore

  warm:
    needs:
      - framework
      - cold
    runs-on: macos-26
    timeout-minutes: 120
    env: *ios_env
    steps: *ios_steps

  cleanup:
    needs:
      - framework
      - cold
      - warm
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - name: delete temporary framework artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" --jq '.artifacts[] | select(.name == "temporary-y") | .id')"
          count="$(printf '%s\n' "$ids" | awk 'NF { count += 1 } END { print count + 0 }')"
          test "$count" -le 1
          if test "$count" -eq 1; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$ids"
          fi
