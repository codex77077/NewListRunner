name: temporary-verify-macos

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        type: string
        required: true

permissions:
  actions: read
  contents: read

concurrency:
  group: temporary-verify-macos
  cancel-in-progress: false

jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 120
    env:
      B3: ${{ secrets.B3 }}
      P0: main
      Q2: ${{ secrets.Q2 }}
      Q3: ${{ secrets.Q3 }}
      A0: ${{ secrets.A0 }}
      A1: ${{ secrets.A1 }}
      A2: ${{ secrets.A2 }}
      A3: ${{ secrets.A3 }}
      A4: ${{ secrets.A4 }}
      A5: ${{ secrets.A5 }}
      A6: ${{ secrets.A6 }}
      A7: ${{ secrets.A7 }}
      A8: ${{ secrets.A8 }}
      A11: ${{ secrets.A11 }}
      W0: ${{ secrets.W0 }}
      W1: ${{ secrets.W1 }}
      T1: 'false'
    steps:
      - uses: actions/setup-go@v6
        with:
          go-version: 1.24.13
          cache: false
      - name: prepare
        env:
          P1: ${{ secrets.P1 }}
          P2: ${{ secrets.P2 }}
          P3: ${{ secrets.P3 }}
        run: |
          install -m 700 -d "$RUNNER_TEMP/k"
          printf '%s\n' "$P2" > "$RUNNER_TEMP/k/i"
          chmod 600 "$RUNNER_TEMP/k/i"
          ssh-keyscan github.com > "$RUNNER_TEMP/k/h" 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/k/i -o IdentitiesOnly=yes -o UserKnownHostsFile=$RUNNER_TEMP/k/h"
          git clone --quiet "$P1" "$RUNNER_TEMP/p"
          git -C "$RUNNER_TEMP/p" checkout --quiet --detach "$P3"
          find "$RUNNER_TEMP/k" -depth -delete
      - uses: actions/download-artifact@v8
        with:
          name: y
          path: ${{ runner.temp }}/i
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}
      - name: execute
        run: cd "$RUNNER_TEMP/p" && ./run-m.sh
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: temporary-e-m
          path: ${{ runner.temp }}/o/e.bin
          retention-days: 1
          if-no-files-found: ignore
